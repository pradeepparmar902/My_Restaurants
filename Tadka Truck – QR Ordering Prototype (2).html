<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tadka Truck – QR Ordering Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#1b1030;--sf:#2a1b4a;--sf2:#38256288;--tx:#fff4ee;--mu:#b9a9d9;--pk:#ff5c8a;--mg:#ffb547;--mn:#5cf2c0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font:15px/1.45 'DM Sans',system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center}
h1,h2,h3,.big{font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif}
#app{width:100%;max-width:430px;padding:14px 14px 96px}
.roles{display:flex;gap:6px;background:var(--sf);padding:5px;border-radius:99px;margin-bottom:14px}
.roles button{flex:1;border:0;background:none;color:var(--mu);padding:9px;border-radius:99px;font:inherit;font-weight:700;cursor:pointer}
.roles button.on{background:var(--pk);color:#fff}
.hero{padding:18px;border-radius:26px;background:linear-gradient(135deg,#ff5c8a,#ff8a4c 60%,#ffb547);color:#2b0f1f;margin-bottom:14px}
.hero h1{font-size:30px;line-height:1.05;font-weight:800}
.hero p{margin-top:6px;font-weight:500}
.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}
.chip{border:1px solid #5a4690;background:none;color:var(--tx);padding:6px 12px;border-radius:99px;font:inherit;cursor:pointer}
.chip.on{background:var(--mn);color:#10302a;border-color:var(--mn);font-weight:700}
.card{background:var(--sf);border-radius:20px;padding:14px;margin:10px 0}
.dish{display:flex;gap:12px;align-items:center}
.em{font-size:34px;width:60px;height:60px;border-radius:18px;background:var(--sf2);display:grid;place-items:center;flex:none}
.dish b{display:block}.mu{color:var(--mu);font-size:13px}
.veg{display:inline-block;width:10px;height:10px;border-radius:2px;border:2px solid #4ade80;margin-right:5px}
.veg.nv{border-color:#f87171}
.qty{display:flex;align-items:center;gap:8px;margin-left:auto}
.qty button,.btn{border:0;font:inherit;font-weight:700;cursor:pointer}
.qty button{width:32px;height:32px;border-radius:50%;background:var(--pk);color:#fff;font-size:18px}
.btn{width:100%;padding:14px;border-radius:16px;background:var(--pk);color:#fff;margin-top:8px;font-size:16px}
.btn.alt{background:var(--mn);color:#10302a}.btn.ghost{background:var(--sf2);color:var(--tx)}
.btn:disabled{opacity:.4;cursor:default}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;display:flex;background:#241543;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid #4a3680}
nav button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-size:12px;padding:6px;cursor:pointer}
nav button.on{color:var(--mg);font-weight:700}nav span{display:block;font-size:20px}
.steps{display:flex;justify-content:space-between;margin:14px 0}
.step{text-align:center;flex:1;color:var(--mu);font-size:12px}
.step i{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--sf2);margin:0 auto 4px;font-style:normal;font-size:18px}
.step.on{color:var(--tx)}.step.on i{background:var(--mn);color:#10302a}
.stars span{font-size:34px;cursor:pointer;filter:grayscale(1);opacity:.5}.stars span.on{filter:none;opacity:1}
.tag{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--sf2);font-weight:700}
.tag.hot{background:var(--pk)}.tag.ok{background:var(--mn);color:#10302a}.tag.vip{background:var(--mg);color:#2b1a00}
.line{display:flex;justify-content:space-between;padding:5px 0}
.tot{font-size:26px;font-weight:800;border-top:1px dashed #5a4690;margin-top:6px;padding-top:10px}
.pts{display:flex;gap:10px}.pts>div{flex:1;background:var(--sf);border-radius:18px;padding:12px}.pts .big{font-size:26px;font-weight:800}
.bar{height:10px;border-radius:9px;background:var(--pk);margin:4px 0 10px}
.wa{background:#0b3d33;border-radius:16px;padding:12px;margin-top:10px;border-left:4px solid var(--mn)}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--mn);color:#10302a;padding:10px 18px;border-radius:99px;font-weight:700;z-index:9;animation:pop .4s}
@keyframes pop{from{transform:translate(-50%,-20px) scale(.8);opacity:0}}
@media(prefers-reduced-motion:reduce){.toast{animation:none}}
.sbox{flex:1;aspect-ratio:1;border-radius:14px;border:2px dashed #5a4690;display:grid;place-items:center;font-size:26px}.sbox.on{border:2px solid var(--mg);background:var(--sf2)}.sbox.new{animation:pop2 .6s}@keyframes pop2{from{transform:scale(.3) rotate(-30deg)}}@media(prefers-reduced-motion:reduce){.sbox.new{animation:none}}
.roles[hidden]{display:none}
button:focus-visible{outline:3px solid var(--mg);outline-offset:2px}
</style></head><body><div id="app"></div>
<script>
const MENU=[
{id:1,e:'🌯',p:120,v:1,n:{en:'Paneer Kathi Roll',hi:'पनीर काठी रोल',gu:'પનીર કાઠી રોલ'}},
{id:2,e:'🍔',p:140,v:0,n:{en:'Smash Chicken Burger',hi:'स्मैश चिकन बर्गर',gu:'સ્મેશ ચિકન બર્ગર'}},
{id:3,e:'🍜',p:110,v:1,n:{en:'Schezwan Noodles',hi:'शेज़वान नूडल्स',gu:'શેઝવાન નૂડલ્સ'}},
{id:4,e:'🥤',p:70,v:1,n:{en:'Mango Masala Cooler',hi:'मैंगो मसाला कूलर',gu:'મેંગો મસાલા કૂલર'}},
{id:5,e:'🍟',p:90,v:1,n:{en:'Peri Peri Fries',hi:'पेरी पेरी फ्राइज़',gu:'પેરી પેરી ફ્રાઇઝ'}},
{id:6,e:'🍮',p:80,v:1,n:{en:'Gulab Jamun Sizzler',hi:'गुलाब जामुन सिज़लर',gu:'ગુલાબ જામુન સિઝલર'}}];
const S={role:'c',tab:'menu',lang:'en',veg:false,cart:{},status:0,tag:'',rating:0,reel:null,review:false,pts:120,stars:2,newStar:false,media:null,shared:false,soc:{},M:{},billSrc:'',pm:'UPI',hist:[{a:340,m:'UPI',o:'app'}],cashReq:false,reviewed:false,draft:{},orders:[],sess:null,ctr:27,track:'',trackRes:'',staff:[{n:'Pradeep',ph:'+919800000001',r:'Admin',mg:true,on:1},{n:'Ravi',ph:'+919800000002',r:'Manager',mg:false,on:1},{n:'Sonal',ph:'+919800000003',r:'Chef',mg:false,on:1},{n:'Imran',ph:'+919800000004',r:'Waiter',mg:false,on:1}],sf:'Waiter',alr:'',wab:true,cmode:'auto',samp:[{no:'C24',t:2,a:540,s:'Bill pushed'},{no:'C25',t:6,a:320,s:'In kitchen'}],spaid:0,cc:'+91',me:{mob:''},lg:{step:0,mob:''},showLogin:false,wtab:'serve',WD:{},split:1,paid:false,toast:''};
const $=document.getElementById('app');
const sub=()=>MENU.reduce((a,m)=>a+(S.cart[m.id]||0)*m.p,0);
const cnt=()=>Object.values(S.draft).reduce((a,b)=>a+b,0);
const disc=()=>(S.reel==='ok'?Math.round(sub()*.1):0)+(S.review?50:0);
const total=()=>Math.max(0,Math.round((sub()-disc())*1.05));
const say=t=>{S.toast=t;draw();setTimeout(()=>{S.toast='';draw()},1800)};
const act=(f)=>{f();draw()};
function menuV(){
 const L={en:'Menu',hi:'मेन्यू',gu:'મેનુ'};
 return `<div class="hero"><h1>Tadka Truck<br>Table 4 🔥</h1><p>${S.sess?(S.sess.pend?'Counter number pending. Get it from the waiter or reception and enter it in the Order tab.':`Counter ${S.sess.no}. Add more anytime until you pay.`):'Scan done. Pick your food, we cook it fresh.'}</p></div>
 <div class="row" style="flex-wrap:wrap">${['en','hi','gu'].map(l=>`<button class="chip ${S.lang==l?'on':''}" onclick="act(()=>S.lang='${l}')">${{en:'English',hi:'हिन्दी',gu:'ગુજરાતી'}[l]}</button>`).join('')}
 <button class="chip ${S.veg?'on':''}" onclick="act(()=>S.veg=!S.veg)">🌱 Veg only</button></div>
 <h2 style="margin-top:14px">${L[S.lang]}</h2>
 ${MENU.filter(m=>!S.veg||m.v).map(m=>`<div class="card dish"><div class="em">${m.e}</div><div><b><span class="veg ${m.v?'':'nv'}"></span>${m.n[S.lang]}</b><span class="mu">₹${m.p}</span></div>
 <div class="qty">${S.draft[m.id]?`<button aria-label="Remove" onclick="act(()=>S.draft[${m.id}]--)">−</button><b>${S.draft[m.id]}</b>`:''}<button aria-label="Add" onclick="act(()=>S.draft[${m.id}]=(S.draft[${m.id}]||0)+1)">+</button></div></div>`).join('')}
 <button class="btn" ${cnt()?'':'disabled'} onclick="placeOrder()">${S.sess?'Add to my order':'Place order'} · ₹${dsub()}</button>`}
function orderV(){
 if(!S.status)return `<div class="card"><h3>No order yet</h3><p class="mu">Add dishes from the menu to start.</p></div>`;
 const st=['Received','Cooking','Ready'],ic=['📥','🍳','🛎️'];
 return `<h2>Your order</h2><div class="steps">${st.map((s,i)=>`<div class="step ${S.status>i?'on':''}"><i>${ic[i]}</i>${s}</div>`).join('')}</div>
 <div class="card">${MENU.filter(m=>S.cart[m.id]).map(m=>`<div class="line"><span>${m.e} ${m.n[S.lang]} × ${S.cart[m.id]}</span><span>₹${m.p*S.cart[m.id]}</span></div>`).join('')}</div>
 <p class="mu">${S.status<3?'The chef updates this live. While you wait, earn rewards in the Rewards tab.':'Your food is ready. Enjoy!'}</p>
 <div class="card"><h3>📸 Share your moment</h3><p class="mu">Snap or record your dish. Tag @tadkatruck and earn 10 bonus points.</p>${S.media?`<p style="margin:8px 0">✅ ${S.media=='reel'?'Reel':'Snap'} ready. Share it:</p><div class="row" style="flex-wrap:wrap">${['Instagram','WhatsApp Status','Snapchat','Facebook'].map(p=>`${S.soc[p]?`<button class="chip on" onclick="act(()=>{if(!S.shared){S.pts+=10;S.shared=true}});say('Shared to ${p} 🎉')">Share to ${p}</button>`:`<button class="chip" onclick="act(()=>S.soc['${p}']=true);say('${p} connected ✅')">Connect ${p}</button>`}`).join('')}</div>`:`<div class="row"><button class="btn alt" onclick="act(()=>S.media='snap')">📸 Take snap</button><button class="btn alt" onclick="act(()=>S.media='reel')">🎬 Record reel</button></div>`}</div>
 <button class="btn ghost" onclick="say('Waiter is coming 🙋')">🙋 Call waiter</button>`}
function rewardV(){
 return `<h2>Post and save</h2><p class="mu">Post a reel or review. The manager approves it and your discount unlocks.</p>${accV()}
 <div class="card"><h3>🎬 Upload a reel</h3><p class="mu">Tag @tadkatruck and say the dish name (type or speak).</p>
 ${S.reel?`<p style="margin-top:8px">${S.reel==='ok'?'✅ Approved: 10% off applied':'⏳ Waiting for manager approval'}</p>`:`<button class="btn alt" onclick="act(()=>S.reel='wait')">Upload reel</button><button class="btn ghost" onclick="say('🎙️ Listening… “Paneer roll at Tadka Truck”')">🎙️ Speak the caption</button>`}</div>
 <div class="card"><h3>⭐ Rate your meal</h3><div class="stars">${[1,2,3,4,5].map(i=>`<span class="${S.rating>=i?'on':''}" onclick="act(()=>S.rating=${i})">⭐</span>`).join('')}</div>
 ${S.rating>=4&&!S.review?`<button class="btn alt" onclick="act(()=>S.review=true)">Post on Google · get ₹50 off</button>`:''}
 ${S.rating&&S.rating<4?`<p class="mu" style="margin-top:6px">Thanks. Tell the manager privately so we can fix it.</p><button class="btn ghost" onclick="say('Sent privately to manager')">Send feedback</button>`:''}
 ${S.review?'<p style="margin-top:8px">✅ Google review posted: ₹50 off applied</p>':''}</div>`}
function billV(){
 if(!S.status)return `<div class="card"><h3>No bill yet</h3><p class="mu">Place an order first.</p></div>`;
 const t=total(),per=Math.ceil(t/S.split);
 if(S.paid)return `<div class="hero" style="background:linear-gradient(135deg,#5cf2c0,#3aa8ff)"><h1>Paid 🎉</h1><p>+1 star ⭐ and +${Math.floor(t/10)} points added to your wallet</p></div>
 ${!S.wab||S.sess&&S.sess.mob?'':`<div class="card"><b>Get the final bill on WhatsApp</b><div style="margin-top:8px">${ccV('pm')}</div><button class="btn alt" onclick="sendBill()">Send my bill</button></div>`}<div class="wa" ${S.wab?'':'hidden'}><b>WhatsApp · Tadka Truck${S.sess&&S.sess.mob?' to '+S.sess.mob:''}</b><p>Thanks for visiting! Bill #1042: ₹${t}. Show this next time for a free Gulab Jamun on your 3rd visit 🍮</p></div>
 ${shareV()}<button class="btn ghost" onclick="act(()=>{S.paid=false;S.status=0;S.cart={};S.reel=null;S.review=false;S.rating=0;S.newStar=false;S.media=null;S.shared=false;S.billSrc='';S.M={};S.cashReq=false;S.reviewed=false;S.sess=null;S.orders=[];S.draft={};S.track='';S.trackRes='';S.tab='menu'})">Start a new order</button>`;
 return `${S.billSrc=='waiter'?`<div class="wa" style="margin:0 0 10px"><b>🧾 Bill from Tadka Truck</b><p>Your waiter order for Table 4. Check the items and pay below.</p></div>`:''}<div class="pts"><div><div class="mu">Points</div><div class="big">${S.pts}</div></div><div><div class="mu">Tier</div><div class="big">🥈 Silver</div></div></div>
 <p class="mu" style="margin-top:8px">${200-S.pts} points to Gold</p><div class="bar" style="width:${S.pts/2}%"></div>
 <div class="card">${S.billSrc=='waiter'?MENU.filter(m=>S.cart[m.id]).map(m=>`<div class="line"><span>${m.e} ${m.n.en} × ${S.cart[m.id]}</span><span>₹${m.p*S.cart[m.id]}</span></div>`).join(''):''}<div class="line"><span>Subtotal</span><span>₹${sub()}</span></div>
 ${S.reel==='ok'?`<div class="line" style="color:var(--mn)"><span>Reel discount</span><span>−₹${Math.round(sub()*.1)}</span></div>`:''}
 ${S.review?`<div class="line" style="color:var(--mn)"><span>Google review</span><span>−₹50</span></div>`:''}
 <div class="line"><span>GST 5%</span><span>₹${Math.round((sub()-disc())*.05)}</span></div>
 <div class="line tot"><span>Total</span><span>₹${t}</span></div></div>
 <div class="card"><b>Split with friends</b><div class="row" style="margin-top:8px">${[1,2,3,4].map(n=>`<button class="chip ${S.split==n?'on':''}" onclick="act(()=>S.split=${n})">${n==1?'Just me':n+' people'}</button>`).join('')}</div>
 ${S.split>1?`<p class="mu" style="margin-top:8px">Each pays ₹${per}. Friends get a UPI link on WhatsApp.</p>`:''}</div>
 ${shareV()}<div class="card"><b>Pay with</b><div class="row" style="flex-wrap:wrap;margin-top:8px">${['UPI','Card','Net banking','Cash at counter'].map(m=>`<button class="chip ${S.pm==m?'on':''}" onclick="act(()=>S.pm='${m}')">${m}</button>`).join('')}</div><p class="mu" style="margin-top:8px">${{UPI:'GPay, PhonePe, Paytm or any UPI app','Card':'Credit or debit card: Visa, Mastercard, RuPay','Net banking':'All major Indian banks','Cash at counter':'Pay the waiter. Your stars still count.'}[S.pm]}</p></div>${S.pm=='Cash at counter'?(S.cashReq?`<div class="wa"><b>⏳ Waiting for the restaurant</b><p>Pay the waiter ₹${t}. Once the owner marks it paid, your star and receipt appear here.</p></div>`:`<button class="btn" onclick="act(()=>S.cashReq=true)">Request waiter to collect ₹${t}</button>`):`<button class="btn" onclick="doPay(S.pm,'app')">Pay ₹${per} with ${S.pm}</button>`}`}
function chefV(){
 const live=S.status>0&&S.status<4;
 return `<div class="hero" style="background:linear-gradient(135deg,#ffb547,#ff8a4c)"><h1>Kitchen queue</h1><p>${live?'1 live order':'All clear. Place an order on the Customer tab.'}</p></div>
 ${S.status&&S.billSrc!='waiter'?`<div class="card"><div class="row sp"><h3>Table 4 · #1042</h3><span class="row">${S.tag?'<span class="tag vip">VIP</span>':''}<span class="tag hot">${S.status==1?'NEW':S.status==2?'COOKING':'READY'}</span></span></div>
 <p class="mu" style="margin:6px 0">${MENU.filter(m=>S.cart[m.id]).map(m=>S.cart[m.id]+'× '+m.n.en).join(', ')}</p>
 ${S.status==1?`<button class="btn" onclick="act(()=>S.status=2)">Start cooking</button>`:S.status==2?`<button class="btn alt" onclick="act(()=>S.status=3)">Mark ready</button>`:'<p>✅ Served</p>'}
 <button class="btn ghost" onclick="act(()=>S.tag=S.tag?'':'rush')">${S.tag?'Remove priority':'⚡ Rush this order'}</button></div>`:''}
 <h3 style="margin-top:14px">Stock</h3>${MENU.slice(0,3).map(m=>`<div class="card row sp"><span>${m.e} ${m.n.en}</span><span class="tag">In stock</span></div>`).join('')}`}
function ownerV(){
 return `<div class="hero" style="background:linear-gradient(135deg,#5cf2c0,#3aa8ff)"><h1>Today ₹18,420</h1><p>64 orders · 38% repeat customers</p></div>
 ${liveV()}${modeV()}${waiterV()}<div class="card"><h3>Reward approvals</h3>${S.reel==='wait'?`<div class="row sp" style="margin-top:8px"><span>🎬 Table 4 reel</span><button class="chip on" onclick="act(()=>S.reel='ok')">Approve 10%</button></div>`:'<p class="mu" style="margin-top:6px">Nothing waiting. Upload a reel as a customer to see it here.</p>'}</div>
 <div class="card"><h3>Best sellers</h3>${[['Paneer Kathi Roll',90],['Smash Burger',70],['Mango Cooler',55]].map(([n,w])=>`<div class="mu" style="margin-top:8px">${n}</div><div class="bar" style="width:${w}%"></div>`).join('')}</div>
 <div class="card"><h3>Growth this week</h3><div class="line"><span>Google reviews</span><b>+23</b></div><div class="line"><span>Reels posted</span><b>+11</b></div><div class="line"><span>Referrals</span><b>+9</b></div><div class="line"><span>Coupons used</span><b>31</b></div></div>
 <div class="card"><h3>Send WhatsApp offer</h3><p class="mu">Customers who haven’t visited in 30 days</p><button class="btn" onclick="say('Offer sent to 42 customers')">Send “We miss you” offer</button></div>`}
function doPay(m,by){const t=total();S.pm=m;S.paid=true;S.pts+=Math.floor(t/10);S.stars=Math.min(5,S.stars+1);S.newStar=true;S.hist.unshift({a:t,m:m,o:by});draw()}
function tagV(){return `<p class="mu" style="margin:8px 0 4px">Customer paid offline? Tag the bill as paid:</p><div class="row" style="flex-wrap:wrap"><button class="chip on" onclick="doPay('Cash','owner')">Cash</button><button class="chip on" onclick="doPay('Card machine','owner')">Card machine</button><button class="chip on" onclick="doPay('UPI at counter','owner')">UPI at counter</button></div>`}
function dashV(){const cur=S.status&&!S.paid?`<div class="line"><span>Table 4 · ₹${total()}</span><span class="tag">⏳ Unpaid</span></div>`:'';const h=S.hist.slice(0,3).map(x=>`<div class="line"><span>₹${x.a} · ${x.m}${x.o=='owner'?' · tagged by restaurant':''}</span><span class="tag ok">✅ Paid</span></div>`).join('');return `<div style="margin-top:10px;border-top:1px dashed #5a4690;padding-top:6px">${S.sess?`<div class="row sp" style="margin-bottom:6px"><span>🎟️ Counter number</span><span class="tag hot" style="font-size:16px">${S.sess.no}</span></div>`:''}<div class="mu">Your bills</div>${cur}${h}</div>`}
function shareV(){const P=['Instagram','WhatsApp Status','Snapchat','Facebook'],g=S.review||S.reviewed;return `<div class="card"><h3>⭐ Review and share</h3><p class="mu">${S.paid?'Loved it? Tell others and earn bonus points.':'Post a Google review to save ₹50 on this bill, or share on social media for 10 bonus points.'}</p>${g?'<p style="margin:8px 0">✅ Google review posted</p>':`<div class="stars" style="margin-top:6px">${[1,2,3,4,5].map(i=>`<span class="${S.rating>=i?'on':''}" onclick="act(()=>S.rating=${i})">⭐</span>`).join('')}</div>${S.rating>=4?`<button class="btn alt" onclick="act(()=>{S.paid?S.reviewed=true:S.review=true})">Post on Google${S.paid?'':' · ₹50 off'}</button>`:S.rating?'<p class="mu">Thanks. Tell the manager privately and we will fix it.</p>':''}`}<div class="row" style="flex-wrap:wrap;margin-top:10px">${P.map(p=>S.soc[p]?`<button class="chip on" onclick="act(()=>{if(!S.shared){S.pts+=10;S.shared=true}});say('Shared to ${p} 🎉')">Share to ${p}</button>`:`<button class="chip" onclick="act(()=>S.soc['${p}']=true);say('${p} connected ✅')">Connect ${p}</button>`).join('')}</div></div>`}
const ST=['','Received','Cooking','Ready','Delivered'];
function pos(o){return Object.fromEntries(Object.entries(o).filter(([k,v])=>v>0))}
function dsub(){return MENU.reduce((a,m)=>a+(S.draft[m.id]||0)*m.p,0)}
function addCart(it){for(const id in it)S.cart[id]=(S.cart[id]||0)+it[id]}

return `<div class="card"><h3>🧾 Bill for open session</h3>${S.sess?`<p class="mu" style="margin:6px 0">Counter ${S.sess.pend?'pending':S.sess.no} · Table 4</p>${MENU.filter(m=>S.cart[m.id]).map(m=>`<div class="line"><span>${m.e} ${m.n.en} × ${S.cart[m.id]}</span><span>₹${m.p*S.cart[m.id]}</span></div>`).join('')}<div class="line tot"><span>${Object.values(S.cart).reduce((a,b)=>a+b,0)} items</span><span>₹${sub()}</span></div>`:'<p class="mu">No open session. Orders booked by the waiter or the customer appear here.</p>'}${S.sess&&S.sess.mob?`<p class="mu">Send to: ${S.sess.mob} (WhatsApp)</p>`:`<p class="mu" style="margin:8px 0">Customer WhatsApp number with country code. They see the bill after login.</p>${ccV('omob')}`}<button class="btn" ${S.sess?'':'disabled'} onclick="pushWaiter()">Push bill to customer</button></div>`}

return `<div class="card"><h3>🔗 Connected accounts</h3><p class="mu">Link once, then post in one tap. Disconnect anytime.</p>${P.map(([p,i])=>`<div class="row sp" style="margin-top:10px"><span>${i} ${p}<br><span class="mu">${S.soc[p]?'Connected as @you.eats':'Not connected'}</span></span><button class="chip ${S.soc[p]?'':'on'}" onclick="act(()=>S.soc['${p}']=${!S.soc[p]});${S.soc[p]?'':`say('${p} connected ✅')`}">${S.soc[p]?'Disconnect':'Connect'}</button></div>`).join('')}</div>`}
function starsV(){return `<div class="card"><div class="row sp"><b>Your stars</b><span class="mu">${S.stars>=5?'Reward unlocked 🎁':S.stars+' of 5 · '+(5-S.stars)+' more for a free dessert'}</span></div><div class="row" style="margin-top:8px">${[1,2,3,4,5].map(i=>`<div class="sbox ${S.stars>=i?'on':''} ${S.newStar&&S.stars==i?'new':''}">${S.stars>=i?'⭐':''}</div>`).join('')}</div>${dashV()}</div>`}
function draw(){if(!portals().includes(S.role))S.role='c';
 const tabs=[['menu','🍽️','Menu'],['order','🧾','Order'],['reward','🎁','Rewards'],['bill','💳','Bill']];
 $.innerHTML=(S.toast?`<div class="toast" role="status">${S.toast}</div>`:'')+
 `${loginBar()}<div class="roles" ${portals().length>1?'':'hidden'}>${[['c','Customer'],['k','Chef'],['w','Waiter'],['o','Owner'],['a','Admin']].filter(([r])=>portals().includes(r)).map(([r,n])=>`<button class="${S.role==r?'on':''}" onclick="act(()=>S.role='${r}')">${n}</button>`).join('')}</div>`+
 (S.role=='c'?(gate()||S.showLogin?loginV():starsV()+pendBanner()+billBanner()+{menu:menuV,order:orderV2,reward:rewardV,bill:billV}[S.tab]()):S.role=='k'?chefV2():S.role=='w'?waiterTabs()+(S.wtab=='book'?bookV():floorV()):S.role=='a'?adminV():ownerV())+
 (S.role=='c'&&!gate()&&!S.showLogin?`<nav>${tabs.map(([k,i,n])=>`<button class="${S.tab==k?'on':''}" onclick="act(()=>S.tab='${k}')"><span>${i}</span>${n}${k=='menu'&&cnt()?' ('+cnt()+')':''}</button>`).join('')}</nav>`:'');
}
draw();
</script></body></html>
